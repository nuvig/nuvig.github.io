<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Feed — jesselevine.net</title>
  <meta name="description" content="Every piece of data this site takes in, newest first — each METAR, TAF, forecast discussion, model and grid snapshot, weather alert and ADS-B snapshot, with the file it came from.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="canonical" href="https://jesselevine.net/feed.html">
  <link rel="stylesheet" href="css/main.css?v=3">
  <style>
    /* A log wants width — the one-liners are raw METARs and TAF lines that
       should not wrap. Wider than the 760px site default, capped so the text
       column stays readable. */
    body { max-width: 1400px; }

    /* The log and the rail. The rail is a second view of the same day, so it
       is the first thing to go when the window cannot hold both. */
    .cols { display: flex; align-items: flex-start; gap: 22px; }
    #feed { flex: 1 1 auto; min-width: 0; }
    #rail { flex: 0 0 210px; position: sticky; top: 52px; }
    @media (max-width: 980px) { #rail { display: none; } }

    #back-link {
      display: inline-block; margin-top: 16px; font-size: 14px;
      text-decoration: none; color: #666;
    }
    #back-link:hover { color: #ccc; }
    .subtitle { color: #666; margin: 4px 0 18px; font-size: 14px; max-width: 76ch; line-height: 1.6; }
    .subtitle a { color: #777; }

    /* ---- controls ---- */
    .bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding-bottom: 12px; margin-bottom: 4px; border-bottom: 1px solid #2a2a2a;
      position: sticky; top: 0; background: #111; z-index: 5;
    }
    #chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #161616; color: #555; border: 1px solid #2c2c2c;
      font-family: inherit; font-size: 12px; padding: 3px 9px;
      border-radius: 999px; cursor: pointer;
    }
    .chip i { width: 7px; height: 7px; border-radius: 50%; background: #333; }
    .chip.on { color: #ccc; border-color: #3a3a3a; background: #1c1c1c; }
    .chip.on i { background: var(--c); }
    .chip:hover { border-color: #555; }

    #q {
      background: #161616; border: 1px solid #2c2c2c; border-radius: 5px;
      color: #ddd; font-family: inherit; font-size: 13px; padding: 4px 9px;
      width: 190px;
    }
    #q:focus { outline: none; border-color: #4a9eff; }
    .spacer { flex: 1 1 auto; }
    #count { color: #555; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    #live {
      background: #1c1c1c; color: #666; border: 1px solid #2c2c2c;
      font-family: inherit; font-size: 12px; padding: 3px 10px;
      border-radius: 5px; cursor: pointer;
    }
    #live.on { color: #22c55e; border-color: #22c55e44; background: #22c55e14; }
    #live-note { color: #555; font-size: 12px; white-space: nowrap; }

    /* ---- day sections ---- */
    .day { margin: 18px 0 0; }
    .day-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
      margin: 0 0 2px; padding-top: 8px; border-top: 1px solid #262626; }
    .day-head h2 { font-size: 14px; color: #bbb; margin: 0; font-weight: 600; }
    .day-n { color: #555; font-size: 12px; font-variant-numeric: tabular-nums; }
    .day-link { color: #4a5b6e; font-size: 12px; text-decoration: none; margin-left: auto; }
    .day-link:hover { color: #4a9eff; }
    .day-cover { color: #4f4f4f; font-size: 11.5px; margin: 0 0 8px; line-height: 1.5; }
    .day-cover.gap { color: #7a5a1e; cursor: help; }
    .day-cover.partial { color: #4a4a4a; }

    /* ---- rows ---- */
    .row {
      display: grid; grid-template-columns: 62px 64px 58px minmax(0, 1fr) auto auto;
      gap: 10px; align-items: baseline; padding: 2px 6px; border-radius: 4px;
      font-size: 12.5px; cursor: pointer; line-height: 1.55;
    }
    .row:hover { background: #191919; }
    .row:focus-visible { outline: 1px solid #4a9eff; outline-offset: -1px; }
    .row.open { background: #1a1a1a; }
    .row time {
      color: #666; font-variant-numeric: tabular-nums;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
    }
    /* a stamp that is the record's own moment, not the moment it arrived */
    .row time.own { border-bottom: 1px dotted #444; cursor: help; }
    .badge {
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em;
      border: 1px solid; border-radius: 999px; padding: 1px 0;
      text-align: center; white-space: nowrap;
    }
    .src { color: #7a7a7a; font-size: 11.5px; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; }
    .one {
      color: #c8c8c8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row:hover .one { color: #e8e8e8; }
    .tag {
      font-size: 10px; color: #7a5a1e; border: 1px solid #7a5a1e55;
      background: #7a5a1e14; border-radius: 3px; padding: 0 5px; cursor: help;
    }
    .bytes { color: #4a4a4a; font-size: 11px; font-variant-numeric: tabular-nums;
      white-space: nowrap; text-align: right; }

    /* ---- expansion ---- */
    .full { margin: 2px 0 10px; padding: 0 6px; }
    .full pre {
      background: #141414; border: 1px solid #2a2a2a; border-radius: 6px;
      padding: 10px 12px; margin: 0; overflow-x: auto; max-height: 460px;
      color: #b8b8b8; font-size: 11.5px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
    }
    /* the polygon map on an airsig expansion */
    .thumb {
      display: block; border: 1px solid #2a2a2a; border-radius: 6px;
      margin: 0 0 6px; background: #141414; cursor: help;
    }

    .prov { color: #555; font-size: 11px; margin-top: 4px; }
    .prov a { color: #6a7f95; }
    .prov a:hover { color: #4a9eff; }

    /* ---- the rail ---- */
    .rail-head {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      color: #888; font-size: 11.5px; padding: 0 0 6px; border-bottom: 1px solid #262626;
      margin-bottom: 6px;
    }
    .rail-head span { color: #555; font-variant-numeric: tabular-nums; }
    #rail .grid { display: grid; gap: 2px; align-items: center; }
    /* Full stream names, turned on their side — two-letter stubs put "afd",
       "aloft" and "airsig" one letter apart. */
    #rail .gh {
      font-size: 9.5px; letter-spacing: 0.02em; cursor: help;
      writing-mode: vertical-rl; transform: rotate(180deg);
      justify-self: center; padding-top: 2px; height: 46px;
    }
    #rail .gr {
      color: #4a4a4a; font-size: 9.5px; font-variant-numeric: tabular-nums;
      text-align: right; padding-right: 2px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #rail .gc {
      display: block; width: 100%; height: 9px; border: 0; border-radius: 2px;
      padding: 0; cursor: pointer;
    }
    #rail .gc.none { background: none; box-shadow: inset 0 0 0 1px #232323; cursor: default; }
    #rail button.gc:hover { outline: 1px solid #ddd; outline-offset: 1px; }

    .row.hit { background: #23303d; }

    .empty { color: #666; font-size: 14px; }
    .empty code { color: #888; }
    .btn {
      background: #1d3a5f; color: #cfe6ff; border: 1px solid #4a9eff;
      font-size: 13px; padding: 6px 16px; border-radius: 5px;
      cursor: pointer; font-family: inherit; margin: 22px 0 0;
    }
    .btn:hover { background: #26497a; }
    .btn:disabled { background: #1a1a1a; color: #555; border-color: #2c2c2c; cursor: default; }


    /* Narrow: the one-liner takes its own full-width line under a header row
       of time / stream / source / tag / size, rather than being squeezed to
       nothing — a truncated raw METAR is the whole point of the row. */
    @media (max-width: 760px) {
      .row { grid-template-columns: 56px 58px minmax(0, 1fr) auto auto; row-gap: 1px;
        padding: 4px 6px; margin-bottom: 2px; }
      .row time, .badge { grid-row: 1; }
      .src { grid-row: 1; grid-column: 3; color: #666; }
      .tag { grid-row: 1; grid-column: 4; }
      .bytes { grid-row: 1; grid-column: 5; }
      .one { grid-row: 2; grid-column: 1 / -1; padding-left: 2px; }
      #q { width: 130px; }
    }
  </style>
</head>
<body>
  <a id="back-link" href="/">← jesselevine.net</a>
  <h1>Data Feed</h1>
  <p class="subtitle">Every record this site takes in, newest first. Times are Eastern. Click a line for the whole record and the file it came from.</p>

  <div class="bar">
    <div id="chips"></div>
    <input id="q" type="search" placeholder="filter…" autocomplete="off" aria-label="Filter records">
    <span class="spacer"></span>
    <span id="count"></span>
    <button id="live" class="on">⏸ pause</button>
    <span id="live-note"></span>
  </div>

  <div class="cols">
    <div id="feed"><p class="empty">reading the archive…</p></div>
    <aside id="rail" aria-label="Bytes archived per hour"></aside>
  </div>

  <button class="btn" id="more" style="display:none" disabled></button>


  <script src="js/site-config.js"></script>
  <script src="js/wx-archive.js?v=2"></script>
  <script src="js/feed.js?v=7"></script>
  <script data-goatcounter="https://jesselevine.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script src="js/pagever.js?v=1" defer></script>
</body>
</html>

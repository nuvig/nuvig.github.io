# Notables compile — the data behind kanp.html's Notables tab.
# scripts/build_notables.py reads the Pi exporter's per-day snapshots on the
# traffic-data branch and picks out VIP callsigns, foreign military, rare
# military types, warbirds, one-airframe types, visitors at Lee and big
# aircraft low near the field.
#
# Published to the `notables-data` branch as a SINGLE force-pushed commit
# that carries the whole tree forward (the rush-data pattern): the previous
# commit is checked out first, the script recompiles only the days whose
# source changed, and the result replaces the branch. Nothing on main grows.

name: Notables

on:
  schedule:
    - cron: '28 * * * *'   # hourly, clear of rush :08, wxarchive :18, wx3dsnap :38, notamarchive :48
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: notables
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check out the notables-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads origin notables-data >/dev/null 2>&1; then
            git clone -q --depth 1 --branch notables-data \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" notables
            rm -rf notables/.git
          else
            echo "no notables-data branch yet — compiling from scratch"
            mkdir -p notables
          fi

      - name: Compile
        run: python3 scripts/build_notables.py --out notables || echo "::warning::build_notables.py reported problems (see the log); publishing what it wrote"

      - name: Publish to the notables-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd notables
          if [ ! -f notables.json ]; then echo "nothing written"; exit 0; fi
          git init -q -b notables-data
          git config user.name  "wx-archive[bot]"
          git config user.email "wx-archive[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "notables: compile $(date -u +'%Y-%m-%d %H:%MZ')"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            notables-data

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changelog — jesselevine.net</title>
  <meta name="description" content="What changed on jesselevine.net — every update to the flight tracker, weather hub, and aviation explainers, pulled live from the site's commit history.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="canonical" href="https://jesselevine.net/changelog.html">
  <link rel="stylesheet" href="css/main.css?v=5">
  <style>
    #back-link {
      display: inline-block; margin-top: 16px; font-size: 14px;
      text-decoration: none; color: #666;
    }
    #back-link:hover { color: #ccc; }
    .subtitle { color: #666; margin: 4px 0 20px; font-size: 14px; }
    .day {
      font-size: 13px; font-weight: 600; color: #aaa; letter-spacing: 0.05em;
      text-transform: uppercase; margin: 22px 0 6px;
    }
    .entry {
      background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
      padding: 10px 14px; margin-bottom: 8px; font-size: 14px; line-height: 1.5;
    }
    .entry .msg { color: #ddd; }
    .entry .body { color: #888; font-size: 13px; margin-top: 4px; white-space: pre-wrap; }
    .entry .meta { color: #555; font-size: 12px; margin-top: 4px; }
    .entry .meta a { color: #666; text-decoration: none; }
    .entry .meta a:hover { color: #4a9eff; }
    #cl-status { color: #f59e0b; font-size: 13px; }
    .btn {
      background: #1d3a5f; color: #cfe6ff; border: 1px solid #4a9eff;
      font-size: 13px; padding: 6px 16px; border-radius: 5px;
      cursor: pointer; font-family: inherit; margin: 14px 0;
    }
    .btn:hover { background: #26497a; }
    footer.sources { margin-top: 30px; font-size: 12px; color: #555; line-height: 1.6; }
    footer.sources a { color: #777; }
  </style>
</head>
<body>
  <a id="back-link" href="/">← jesselevine.net</a>
  <h1>Changelog</h1>
  <p class="subtitle">Every change to this site, newest first — read live from the
    <a href="https://github.com/nuvig/nuvig.github.io/commits/main" style="color:#777">commit history</a>.</p>

  <span id="cl-status">loading…</span>
  <div id="cl-list"></div>
  <button class="btn" id="cl-more" style="display:none">Show older changes</button>

  <footer class="sources">
    Pulled from the GitHub API in your browser; if it rate-limits, the
    <a href="https://github.com/nuvig/nuvig.github.io/commits/main">full history</a> is on GitHub.
  </footer>

  <script src="js/changelog.js?v=1"></script>
</body>
</html>
